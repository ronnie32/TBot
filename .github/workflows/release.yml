name: Release

on:
  push:
    tags:
      - '*'  

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Setup Version ID
      run: |
        TAG_VERSION="${GITHUB_REF_NAME}"
        DOTNET_VERSION="${TAG_VERSION#v}"
        if [[ "$DOTNET_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-beta([0-9]+)$ ]]; then
          ASSEMBLY_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
        else
          ASSEMBLY_VERSION="${DOTNET_VERSION%%-*}.0"
        fi
        echo "SNAP_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
        echo "DOTNET_VERSION=$DOTNET_VERSION" >> "$GITHUB_ENV"
        echo "ASSEMBLY_VERSION=$ASSEMBLY_VERSION" >> "$GITHUB_ENV"
    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Setup GO
      uses: actions/setup-go@v2
      with:
        go-version: '~1.23.0'

    - name: Run TBot tests
      run: dotnet test TBot.Tests -c Release --no-restore
    - name: Run ogame tests
      run: go test ./cmd/ogamed-tbot ./pkg/wrapper -count=10
      working-directory: ogame
      
    - name: Build TBot win64
      run: dotnet publish TBot -c Release -p:Version=${{ env.DOTNET_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }} -p:InformationalVersion=${{ env.DOTNET_VERSION }} -r win-x64 -o publish/win64/ -p:PublishSingleFile=true --self-contained true
    - name: Build ogamed win64
      run: | 
        cd ${{ github.workspace }}/ogame/cmd/ogamed-tbot
        env GOOS=windows GOARCH=amd64 go build -o ogamed.exe
        cd ${{ github.workspace }}
        mv ${{ github.workspace }}/ogame/cmd/ogamed-tbot/ogamed.exe ${{ github.workspace }}/publish/win64/
        cp ${{ github.workspace }}/README.md ${{ github.workspace }}/publish/win64/
    - name: Package win64
      uses: montudor/action-zip@v1
      with:
        args: zip -qq -r TBot-${{ env.SNAP_VERSION }}-win64.zip publish/win64/

    - name: Build TBot win32
      run: dotnet publish TBot -c Release -p:Version=${{ env.DOTNET_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }} -p:InformationalVersion=${{ env.DOTNET_VERSION }} -r win-x86 -o publish/win32/ -p:PublishSingleFile=true --self-contained true
    - name: Build ogamed win32
      run: | 
        cd ${{ github.workspace }}/ogame/cmd/ogamed-tbot
        env GOOS=windows GOARCH=386 go build -o ogamed.exe
        cd ${{ github.workspace }}/
        mv ${{ github.workspace }}/ogame/cmd/ogamed-tbot/ogamed.exe ${{ github.workspace }}/publish/win32/
        cp ${{ github.workspace }}/README.md ${{ github.workspace }}/publish/win32/
    - name: Package win32
      uses: montudor/action-zip@v1
      with:
        args: zip -qq -r TBot-${{ env.SNAP_VERSION }}-win32.zip publish/win32/
        
    - name: Build TBot TBot linux64
      run: dotnet publish TBot -c Release -p:Version=${{ env.DOTNET_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }} -p:InformationalVersion=${{ env.DOTNET_VERSION }} -r linux-x64 -o publish/linux64/ -p:PublishSingleFile=true --self-contained true
    - name: Build ogamed linux64
      run: | 
        cd ${{ github.workspace }}/ogame/cmd/ogamed-tbot
        env GOOS=linux GOARCH=amd64 go build -o ogamed
        cd ${{ github.workspace }}
        mv ${{ github.workspace }}/ogame/cmd/ogamed-tbot/ogamed ${{ github.workspace }}/publish/linux64/
        chmod +x ${{ github.workspace }}/publish/linux64/TBot
        chmod +x ${{ github.workspace }}/publish/linux64/ogamed
        cp ${{ github.workspace }}/README.md ${{ github.workspace }}/publish/linux64/
    - name: Package linux64
      uses: montudor/action-zip@v1
      with:
        args: zip -qq -r TBot-${{ env.SNAP_VERSION }}-linux64.zip publish/linux64/
        
    - name: Build TBot TBot linuxarm
      run: dotnet publish TBot -c Release -p:Version=${{ env.DOTNET_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }} -p:InformationalVersion=${{ env.DOTNET_VERSION }} -r linux-arm -o publish/linuxarm/ -p:PublishSingleFile=true --self-contained true
    - name: Build ogamed linuxarm
      run: | 
        cd ${{ github.workspace }}/ogame/cmd/ogamed-tbot
        env GOOS=linux GOARCH=arm GOARM=7 go build -o ogamed
        cd ${{ github.workspace }}
        mv ${{ github.workspace }}/ogame/cmd/ogamed-tbot/ogamed ${{ github.workspace }}/publish/linuxarm/
        chmod +x ${{ github.workspace }}/publish/linuxarm/TBot
        chmod +x ${{ github.workspace }}/publish/linuxarm/ogamed
        cp ${{ github.workspace }}/README.md ${{ github.workspace }}/publish/linuxarm/
    - name: Package linuxarm
      uses: montudor/action-zip@v1
      with:
        args: zip -qq -r TBot-${{ env.SNAP_VERSION }}-linuxarm.zip publish/linuxarm/

    - name: Build TBot TBot linuxarm64
      run: dotnet publish TBot -c Release -p:Version=${{ env.DOTNET_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }} -p:InformationalVersion=${{ env.DOTNET_VERSION }} -r linux-arm64 -o publish/linuxarm64/ -p:PublishSingleFile=true --self-contained true
    - name: Build ogamed linuxarm64
      run: | 
        cd ${{ github.workspace }}/ogame/cmd/ogamed-tbot
        env GOOS=linux GOARCH=arm64 go build -o ogamed
        cd ${{ github.workspace }}
        mv ${{ github.workspace }}/ogame/cmd/ogamed-tbot/ogamed ${{ github.workspace }}/publish/linuxarm64/
        chmod +x ${{ github.workspace }}/publish/linuxarm64/TBot
        chmod +x ${{ github.workspace }}/publish/linuxarm64/ogamed
        cp ${{ github.workspace }}/README.md ${{ github.workspace }}/publish/linuxarm64/
    - name: Package linuxarm64
      uses: montudor/action-zip@v1
      with:
        args: zip -qq -r TBot-${{ env.SNAP_VERSION }}-linuxarm64.zip publish/linuxarm64/
        
    - name: Build TBot TBot osx64
      run: dotnet publish TBot -c Release -p:Version=${{ env.DOTNET_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }} -p:InformationalVersion=${{ env.DOTNET_VERSION }} -r osx-x64 -o publish/osx64/ -p:PublishSingleFile=true --self-contained true
    - name: Build ogamed osx64
      run: | 
        cd ${{ github.workspace }}/ogame/cmd/ogamed-tbot
        env GOOS=darwin GOARCH=amd64 go build -o ogamed
        cd ${{ github.workspace }}
        mv ${{ github.workspace }}/ogame/cmd/ogamed-tbot/ogamed ${{ github.workspace }}/publish/osx64/
        chmod +x ${{ github.workspace }}/publish/osx64/TBot
        chmod +x ${{ github.workspace }}/publish/osx64/ogamed
        cp ${{ github.workspace }}/README.md ${{ github.workspace }}/publish/osx64/
    - name: Package osx64
      uses: montudor/action-zip@v1
      with:
        args: zip -qq -r TBot-${{ env.SNAP_VERSION }}-osx64.zip publish/osx64/
        
    - name: Build TBot TBot osx-arm64
      run: dotnet publish TBot -c Release -p:Version=${{ env.DOTNET_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }} -p:InformationalVersion=${{ env.DOTNET_VERSION }} -r osx-arm64 -o publish/osx-arm64/ -p:PublishSingleFile=true --self-contained true
    - name: Build ogamed osx-arm64
      run: | 
        cd ${{ github.workspace }}/ogame/cmd/ogamed-tbot
        env GOOS=darwin GOARCH=arm64 go build -o ogamed
        cd ${{ github.workspace }}
        mv ${{ github.workspace }}/ogame/cmd/ogamed-tbot/ogamed ${{ github.workspace }}/publish/osx-arm64/
        chmod +x ${{ github.workspace }}/publish/osx-arm64/TBot
        chmod +x ${{ github.workspace }}/publish/osx-arm64/ogamed
        cp ${{ github.workspace }}/README.md ${{ github.workspace }}/publish/osx-arm64/
    - name: Package osx-arm64
      uses: montudor/action-zip@v1
      with:
        args: zip -qq -r TBot-${{ env.SNAP_VERSION }}-osx-arm64.zip publish/osx-arm64/
        
    - name: Draft Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: ${{ github.workspace }}/TBot-${{ env.SNAP_VERSION }}-win64.zip,${{ github.workspace }}/TBot-${{ env.SNAP_VERSION }}-win32.zip,${{ github.workspace }}/TBot-${{ env.SNAP_VERSION }}-linux64.zip,${{ github.workspace }}/TBot-${{ env.SNAP_VERSION }}-linuxarm.zip,${{ github.workspace }}/TBot-${{ env.SNAP_VERSION }}-linuxarm64.zip,${{ github.workspace }}/TBot-${{ env.SNAP_VERSION }}-osx64.zip,${{ github.workspace }}/TBot-${{ env.SNAP_VERSION }}-osx-arm64.zip
        draft: true
        token: ${{ secrets.GITHUB_TOKEN }}
